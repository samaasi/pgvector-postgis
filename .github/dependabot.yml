version: 2

updates:
  # Keep GitHub Actions up to date (they are pinned to commit SHAs with a version comment)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
      include: "scope"

  # The Docker base image is intentionally NOT listed here: the FROM line is built from
  # ARGs (PG_MAJOR / PGVECTOR_VERSION), which Dependabot cannot resolve. Renovate tracks the
  # pgvector version instead (see renovate.json).
