name: Build and Publish Docker Image

on:
  push:
    branches: [master, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/pgvector-postgis
  # PostgreSQL major version that receives the "latest" tag
  LATEST_PG_MAJOR: '18'
  # Only publish from master and version tags; develop and PRs just build
  PUBLISH: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_major: ['17', '18']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (required for multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            # On master → "pg<N>", plus "latest" for the newest major
            type=raw,value=pg${{ matrix.pg_major }},enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' && matrix.pg_major == env.LATEST_PG_MAJOR }}
            # On version tags → semver tags (e.g. v1.2.3 → 1.2.3-pg18, 1.2-pg18, 1-pg18)
            type=semver,pattern={{version}},suffix=-pg${{ matrix.pg_major }}
            type=semver,pattern={{major}}.{{minor}},suffix=-pg${{ matrix.pg_major }}
            type=semver,pattern={{major}},suffix=-pg${{ matrix.pg_major }}
            # Always include the short SHA for traceability
            type=sha,prefix=sha-,suffix=-pg${{ matrix.pg_major }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          build-args: |
            PG_MAJOR=${{ matrix.pg_major }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pg${{ matrix.pg_major }}
          cache-to: type=gha,mode=max,scope=pg${{ matrix.pg_major }}
          provenance: true
          sbom: true

      - name: Print image digest
        if: env.PUBLISH == 'true'
        run: echo "Pushed image digest ${{ steps.build.outputs.digest }}"

      # Scan the exact image that was just pushed for vulnerabilities
      - name: Run Trivy vulnerability scanner
        if: env.PUBLISH == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true
